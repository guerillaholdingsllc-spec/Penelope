      difficult and expensive. Even with a low price point, the cost of reaching and
      converting enough SMBs to hit the estimated monthly revenue potential (which
      is already quite modest) could quickly outweigh the revenue generated.

      *   **Integration Friction:** SMBs interact with reviews across multiple platforms
      (Google My Business, Yelp, Facebook, industry-specific sites). A standalone
      micro-tool would either require manual copy-pasting (adding friction) or complex,
