      *   **Email Fatigue & Deliverability:** Customers are bombarded with emails.
      A welcome email immediately followed by an upsell can be perceived as pushy,
      leading to low open rates, high unsubscribe rates, or emails landing in spam
      folders, effectively killing the opportunity before it starts.

      *   **Product-Market Fit for Upsell:** The "full book series" might not be a
      natural or desired next step for all initial Gumroad buyers. If the initial
