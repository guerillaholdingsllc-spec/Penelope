      *   **AI Agent Limitations for Creative Tasks:** While an AI can generate text,
      crafting compelling, genre-specific book descriptions that truly resonate with
      a target audience often requires nuanced understanding and creative judgment
      that generic AI models may struggle with, risking bland or off-target output
